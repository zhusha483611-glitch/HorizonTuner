name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MA_FH5Trainer/HorizonTuner.sln

      - name: Build
        run: dotnet build MA_FH5Trainer/HorizonTuner.sln --configuration Release --no-restore

      # 测试项目已移除（曾覆盖转换器/配置迁移/预设/节流动作），重建后恢复：
      # - name: Test
      #   run: dotnet test MA_FH5Trainer/HorizonTuner.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"