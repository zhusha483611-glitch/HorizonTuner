name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MA_FH5Trainer/HorizonTuner.sln -p:Platform=x64

      - name: Build
        run: dotnet build MA_FH5Trainer/HorizonTuner.sln --configuration Release --no-restore -p:Platform=x64

      - name: Test
        run: dotnet test MA_FH5Trainer/HorizonTuner.sln --configuration Release --no-build --no-restore -p:Platform=x64 --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore