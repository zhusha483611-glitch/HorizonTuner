name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MA_FH5Trainer/MA_FH5Trainer.sln

      - name: Build
        run: dotnet build MA_FH5Trainer/MA_FH5Trainer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MA_FH5Trainer/MA_FH5Trainer.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore